<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Watch</title>
<style>
  :root { --bg: #f4f6f8; --grid: #e2e6ea; --panel: rgba(255,255,255,.88); --text: #1d2329; --muted: #66707a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12161a; --grid: #1f262d; --panel: rgba(24,29,34,.9); --text: #e6eaee; --muted: #8b96a1; }
  }
  :root[data-theme="dark"] { --bg: #12161a; --grid: #1f262d; --panel: rgba(24,29,34,.9); --text: #e6eaee; --muted: #8b96a1; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: var(--panel); border-radius: 10px; padding: 10px 12px;
           box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .panel h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #top { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
         flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); padding: 6px 10px; }
  #top button { font: inherit; border: 1px solid var(--grid); background: transparent; color: var(--text);
                border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #top button.on { background: #2f7de1; color: #fff; border-color: #2f7de1; }
  #top button.ready { background: #19a979; color: #fff; border-color: #19a979; }
  #info { color: var(--muted); font-size: 12px; width: 100%; text-align: center; }
  #prog { width: 300px; }
  #prog canvas { width: 100%; height: 120px; display: block; }
  #progcap { font-size: 12px; color: var(--muted); }
  #left { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 10px; max-width: calc(100vw - 48px); }
  #left .panel { position: static; }
  #models { min-width: 220px; }
  #models table { border-collapse: collapse; font-size: 13px; }
  #models th { color: var(--muted); font-weight: 600; font-size: 12px; text-align: right; padding: 2px 8px; }
  #models th:first-child, #models td:first-child { text-align: left; padding-left: 0; }
  #models td { text-align: right; padding: 3px 8px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--grid); }
  #board { top: 12px; right: 12px; min-width: 210px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .panel.hide { display: none; }
  #rows > div { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; padding: 1px 4px;
                border-radius: 4px; font-size: 13px; }
  #rows > div.sel { background: rgba(47,125,225,.18); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel">
  <button id="newround" title="load the newest models and restart: everyone starts from scratch">new round</button>
  <button id="pause">pause</button>
  <button id="view" class="on">whole map</button>
  <button data-panel="prog" class="on">progress</button>
  <button data-panel="models" class="on">models</button>
  <button data-panel="board" class="on">players</button>
  <span id="info"></span>
</div>
<div id="left">
  <div id="prog" class="panel"><h3>Progress</h3><div id="progcap">waiting for the first evaluation</div><canvas id="pc"></canvas></div>
  <div id="models" class="panel"><h3>Models in this arena (this round; rates per player)</h3><div id="mrows"></div></div>
</div>
<div id="board" class="panel"><h3 id="title">Players</h3><div id="rows"></div></div>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dpr = () => devicePixelRatio || 1;
let F = null, follow = -1, cam = {x: 0, y: 0, z: 0.1};

function resize() { cv.width = innerWidth * dpr(); cv.height = innerHeight * dpr(); }
addEventListener("resize", resize); resize();

// ---- models and colours: one colour per model, grey for the scripted bots
const palette = ["#2f7de1", "#e8743b", "#19a979", "#945ecf", "#ed4a7b", "#13a4b4", "#bf399e", "#6c8893"];
const modelOf = i => (F && F.names[i]) || "?";
const modelIdx = {};
const colorOf = i => {
  const m = modelOf(i);
  if (m === "bot") return "#9aa3ab";
  if (!(m in modelIdx)) modelIdx[m] = Object.keys(modelIdx).length;
  return palette[modelIdx[m] % palette.length];
};
const name = i => `${modelOf(i)} #${i}`;

// ---- controls
$("newround").onclick = () => fetch("/newround");
$("pause").onclick = () => fetch("/pause");
$("view").onclick = () => setFollow(-1);
// panel toggles, remembered per browser
const hidden = (() => { try { return JSON.parse(localStorage.getItem("watch.hidden")) || []; } catch (e) { return []; } })();
document.querySelectorAll("[data-panel]").forEach(b => {
  const p = $(b.dataset.panel);
  const set = h => { p.classList.toggle("hide", h); b.classList.toggle("on", !h); };
  set(hidden.includes(b.dataset.panel));
  b.onclick = () => {
    set(!p.classList.contains("hide"));
    const now = [...document.querySelectorAll("[data-panel]")].filter(x => $(x.dataset.panel).classList.contains("hide")).map(x => x.dataset.panel);
    try { localStorage.setItem("watch.hidden", JSON.stringify(now)); } catch (e) {}
  };
});
// clicks are handled on the container: the rows are re-rendered every 300 ms and a listener on a
// row could vanish between mouse-down and mouse-up
$("rows").addEventListener("click", e => {
  const d = e.target.closest("[data-i]");
  if (d) setFollow(+d.dataset.i === follow ? -1 : +d.dataset.i);
});
function setFollow(i) { follow = i; $("view").classList.toggle("on", i < 0); if (F) panels(); }

// ---- arena
function draw() {
  requestAnimationFrame(draw);
  if (!F || !F.cells) return;
  const W = cv.width, H = cv.height, half = F.map / 2;
  let tx = 0, ty = 0, tz = Math.min(W, H) / F.map * 0.98;
  if (follow >= 0) {
    const mine = F.cells.filter(c => c[3] === follow);
    if (mine.length) {
      let m = 0;
      mine.forEach(c => { const w = c[2] * c[2]; tx += c[0] * w; ty += c[1] * w; m += w; });
      tx /= m; ty /= m;
      tz = Math.min(W, H) / (900 + Math.sqrt(m) * 9);
    } else { tx = cam.x; ty = cam.y; tz = cam.z; }       // dead: hold the camera until it respawns
  }
  cam.x += (tx - cam.x) * 0.2; cam.y += (ty - cam.y) * 0.2; cam.z += (tz - cam.z) * 0.15;
  const z = cam.z, sx = x => (x - cam.x) * z + W / 2, sy = y => (y - cam.y) * z + H / 2;
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
  const step = z < 0.08 ? 1000 : 250;
  for (let x = -half; x <= half; x += step) { ctx.beginPath(); ctx.moveTo(sx(x), sy(-half)); ctx.lineTo(sx(x), sy(half)); ctx.stroke(); }
  for (let y = -half; y <= half; y += step) { ctx.beginPath(); ctx.moveTo(sx(-half), sy(y)); ctx.lineTo(sx(half), sy(y)); ctx.stroke(); }
  const fr = Math.max(F.food_r * z, 0.8);
  ctx.fillStyle = "#8bc34a";
  for (let i = 0; i < F.food.length; i += 2) ctx.fillRect(sx(F.food[i]) - fr, sy(F.food[i + 1]) - fr, fr * 2, fr * 2);
  ctx.fillStyle = "#b0855a";
  const er = Math.max(F.eject_r * z, 1.2);
  for (let i = 0; i < F.eject.length; i += 2) { ctx.beginPath(); ctx.arc(sx(F.eject[i]), sy(F.eject[i + 1]), er, 0, 7); ctx.fill(); }
  for (const c of F.cells.slice().sort((a, b) => a[2] - b[2])) {
    const r = Math.max(c[2] * z, 1.5);
    ctx.beginPath(); ctx.arc(sx(c[0]), sy(c[1]), r, 0, 7);
    ctx.fillStyle = colorOf(c[3]); ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = c[3] === follow ? "#ffd400" : "rgba(0,0,0,.25)"; ctx.stroke();
    if (r > 14) {
      ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.max(10, r * 0.35)}px system-ui`; ctx.textAlign = "center";
      ctx.fillText(name(c[3]), sx(c[0]), sy(c[1]) + r * 0.12);
    }
  }
  for (const v of F.virus) {
    ctx.beginPath(); ctx.arc(sx(v[0]), sy(v[1]), Math.max(v[2] * z, 2), 0, 7);
    ctx.fillStyle = "rgba(51,204,51,.75)"; ctx.fill(); ctx.strokeStyle = "#1e7a1e"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ---- side panels and status
function panels() {
  const rows = F.mass.map((m, i) => [i, m]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
  $("title").textContent = `Players by mass (${rows.length} alive) · click to follow` + (follow >= 0 ? ", again to stop" : "");
  // mass gained per minute of the current life (from the spawn mass of 10); shown after 10 s alive
  const rate = i => { const t = (F.life_s || [])[i] || 0; return t >= 10 ? Math.max(0, F.mass[i] - 10) / (t / 60) : null; };
  $("rows").innerHTML = rows.map(([i, m], r) => {
    const q = rate(i);
    return `<div data-i="${i}" class="${i === follow ? "sel" : ""}"><span>${r + 1}. <span class="sw" style="background:${colorOf(i)}"></span>${name(i)}</span>` +
      `<span><b>${m}</b> <small style="opacity:.7">${q === null ? "" : Math.round(q) + "/min"}</small></span></div>`;
  }).join("");
  const agg = {};
  F.mass.forEach((m, i) => {
    const a = agg[modelOf(i)] || (agg[modelOf(i)] = {n: 0, alive: 0, mass: 0, best: 0, splits: 0, ejects: 0, deaths: 0, rsum: 0, rn: 0, i});
    const q = rate(i);
    if (q !== null) { a.rsum += q; a.rn++; }
    a.n++; a.alive += m > 0; a.mass += m; a.best = Math.max(a.best, m); a.splits += (F.splits || [])[i] || 0;
    a.ejects += (F.ejects || [])[i] || 0; a.deaths += (F.deaths || [])[i] || 0;
  });
  const mins = Math.max(F.round_s / 60, 1 / 60);
  $("mrows").innerHTML = `<table><tr><th>model</th><th>players</th><th>alive</th><th>avg mass</th><th>best</th><th title="mass gained per minute of the current life (players alive 10 s+)">mass/min</th><th>splits/min</th><th>W/min</th><th>deaths</th></tr>` +
    Object.entries(agg).sort((a, b) => b[1].mass / b[1].n - a[1].mass / a[1].n).map(([k, a]) =>
      `<tr><td><span class="sw" style="background:${colorOf(a.i)}"></span>${k}</td><td>${a.n}</td><td>${a.alive}</td>` +
      `<td><b>${Math.round(a.mass / a.n)}</b></td><td>${a.best}</td><td>${a.rn ? Math.round(a.rsum / a.rn) : "-"}</td><td>${(a.splits / a.n / mins).toFixed(2)}</td>` +
      `<td>${(a.ejects / a.n / mins).toFixed(2)}</td><td>${a.deaths}</td></tr>`).join("") +
    `</table>`;
  $("pause").classList.toggle("on", F.paused);
  $("newround").classList.toggle("ready", !!F.ready);
  $("newround").textContent = F.ready ? "new round (new models ready)" : "new round";
  $("info").textContent = `${F.title || "waiting for models"} · round ${F.round}, ` +
    `${Math.floor(F.round_s / 60)}:${String(F.round_s % 60).padStart(2, "0")} · ${F.rate}× real time`;
}

// ---- progress chart (evolution: per generation; plain run: per evaluated checkpoint)
async function progress() {
  try {
    const rows = await (await fetch("/progress", {cache: "no-store"})).json();
    const pc = $("pc"), c = pc.getContext("2d");
    const W = pc.width = pc.clientWidth * dpr(), H = pc.height = pc.clientHeight * dpr();
    c.clearRect(0, 0, W, H);
    if (rows.length) {
      const names = Object.keys(rows[rows.length - 1].series);
      const cols = ["#2f7de1", "#999", "#c77", "#19a979"];
      const hi = Math.max(...rows.flatMap(r => Object.values(r.series))) * 1.1 || 1;
      const x = i => 8 * dpr() + (W - 16 * dpr()) * (rows.length < 2 ? 0.5 : i / (rows.length - 1));
      const y = v => H - 6 * dpr() - (H - 12 * dpr()) * v / hi;
      names.forEach((k, j) => {
        c.strokeStyle = cols[j % cols.length]; c.fillStyle = c.strokeStyle; c.lineWidth = (j ? 1.2 : 2.5) * dpr();
        c.beginPath();
        rows.forEach((r, i) => { if (k in r.series) (i ? c.lineTo : c.moveTo).call(c, x(i), y(r.series[k])); });
        c.stroke();
        rows.forEach((r, i) => { if (k in r.series) { c.beginPath(); c.arc(x(i), y(r.series[k]), 2.5 * dpr(), 0, 7); c.fill(); } });
      });
      const last = rows[rows.length - 1];
      $("progcap").innerHTML = "Avg mass in shared 50-player arenas: " +
        names.map((k, j) => `<b style="color:${cols[j % cols.length]}">${k}</b>`).join(", ") +
        `. Last (${last.label}): ` + names.map(k => `${k} ${Math.round(last.series[k])}`).join(", ");
    }
  } catch (e) {}
  setTimeout(progress, 20000);
}

let lastPanels = 0;
async function poll() {
  try {
    F = await (await fetch("/frame", {cache: "no-store"})).json();
    if (F.cells && performance.now() - lastPanels > 300) { panels(); lastPanels = performance.now(); }
  } catch (e) {}
  setTimeout(poll, 33);
}
progress(); poll(); draw();
</script>
</body>
</html>
