[project]
name = "oxidish"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cma>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "torch>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.7",
]
# ONNX export of trained vision nets (scripts/export.sh)
export = [
    "onnx>=1.17",
    "onnxscript>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["arena", "training/rl"]
