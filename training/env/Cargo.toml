[package]
name = "oxidish_env"
version = "0.1.0"
edition = "2021"
license = "WTFPL"

[lib]
name = "oxidish_env"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
ogar = { path = "../../server", default-features = false }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
numpy = "0.25"
serde_json = "1"
