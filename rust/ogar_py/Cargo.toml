[package]
name = "ogar_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "ogar_py"
crate-type = ["cdylib"]

[dependencies]
ogar = { path = "../ogar", default-features = false }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
numpy = "0.25"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
