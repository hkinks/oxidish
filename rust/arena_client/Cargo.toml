[package]
name = "arena_client"
version = "0.1.0"
edition = "2021"
license = "WTFPL"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
